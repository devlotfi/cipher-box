androidx-room3-compiler = { module = "androidx.room3:room3-compiler", version.ref = "room3Compiler" }
androidx-room3-runtime = { module = "androidx.room3:room3-runtime", version.ref = "room3Runtime" }
androidx-sqlite = { module = "androidx.sqlite:sqlite", version.ref = "sqlite" }
bcprov-jdk18on = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bcprovJdk18on" }
compose-form = { module = "com.github.devlotfi:compose-form", version.ref = "composeForm" }
